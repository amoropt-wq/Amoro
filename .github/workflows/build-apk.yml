name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT/licenses"
          for hash in \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            "d56f5187479451eabf01fb78af6dfcb131a6481e" \
            "601085b94cd77f0b54ff86406957099ebe79c4d6"; do
            grep -qxF "$hash" "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || echo "$hash" >> "$SDK_ROOT/licenses/android-sdk-license"
          done
          grep -qxF "d975f751698a77b662f1254ddbeed3901e976f5a" "$SDK_ROOT/licenses/intel-android-extra-license" 2>/dev/null || echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> "$SDK_ROOT/licenses/intel-android-extra-license"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            (yes 2>/dev/null || true) | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Decode debug keystore
        run: tr -d '\r\n' < debug.keystore.base64 | base64 -d > debug.keystore

      - name: Create .env from GitHub Secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          if [ -n "$TELEGRAM_API_ID" ] && [ -n "$TELEGRAM_API_HASH" ]; then
            printf "TELEGRAM_API_ID=%s\nTELEGRAM_API_HASH=%s\n" "$TELEGRAM_API_ID" "$TELEGRAM_API_HASH" > .env
          else
            cp .env.example .env
            echo "::warning::TELEGRAM_API_ID atau TELEGRAM_API_HASH belum diset di GitHub Secrets. Menggunakan placeholder dari .env.example."
          fi

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --tests com.example.JsonPhoneFinderTest --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeleCraft-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
